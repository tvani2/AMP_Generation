# Experiment: E. coli + S. aureus (organism-conditional, no leveling)
extends: default.yaml

experiment:
  name: ecoli_aureus
  description: Phase-2 diffusion conditioned on E. coli and S. aureus

data:
  csv: data/processed/EColi_Aureus.csv
  latents_dir: data/processed/latents/latents_p2_EcoliAureus/cond_latents_new
  files:
    latents: cond_latents.npy
    organisms: cond_organisms.npy
    organism_map: organism_map.npy

checkpoints:
  phase1: checkpoints/phase1/best_model.pth
  phase2: checkpoints/phase2_AureusEcoli/best_model.pth

generation:
  num_sequences: 15000
  batch_size: 64
  cfg_scale: 1.0
  output_dir: results/generated/ecoli_aureus

nonamp:
  csv: data/processed/EColi_Aureus_NonAmps.csv
  latents_dir: data/processed/latents/latents_p2_EColi_Aureus_nonamps/cond_latents_new
  checkpoint: checkpoints/phase2_AureusEcoli/nonamp/best_model.pth
